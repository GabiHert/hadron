# release.conf: read by scripts/release.sh and scripts/build-release.sh.
APP_NAME="Hadron"                    # bundle is $APP_NAME.app, executable Contents/MacOS/$APP_NAME
BUNDLE_ID="tech.bhlabs.hadron"       # CFBundleIdentifier; the build must produce it
REPO="GabiHert/hadron"               # GitHub owner/name that hosts the releases
GH_ACCOUNT="GabiHert"                # gh account that publishes (gh auth token -u $GH_ACCOUNT)
BRANCH="main"                        # releases are cut from this branch
# Builds the app with the version baked in. $VERSION is the tag, e.g. v1.2.3.
BUILD_CMD='make build VERSION="$VERSION"'
APP_PATH="build/bin/$APP_NAME.app"   # where BUILD_CMD leaves the bundle
TEST_CMD='make test'                 # run before building; '' to skip
ENTITLEMENTS="build/darwin/entitlements.plist"  # used only for Developer ID signing; '' for none
ARCH="arm64"                         # zip suffix: darwin-arm64 or darwin-universal
